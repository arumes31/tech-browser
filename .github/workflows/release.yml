name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

# Runs queue up so every push to main gets its own, strictly increasing version.
concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Next version
        id: version
        shell: powershell
        run: |
          # A pushed v* tag releases exactly that version; a push to main takes the next patch.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          else {
              $version = ./scripts/version.ps1 -NextRelease
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Unexpected version: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build package
        shell: powershell
        run: ./scripts/build-toolbox-gdi.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Verify package
        shell: powershell
        run: ./scripts/verify-toolbox-gdi.ps1 -Artifact 'dist\Tech-Browser-${{ steps.version.outputs.version }}-x64-gdi.scapp'
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # A rerun of an already published commit replaces the file instead of creating a new release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.scapp --clobber
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" dist/*.scapp --target "$GITHUB_SHA" --generate-notes --prerelease
          else
            gh release create "$TAG" dist/*.scapp --target "$GITHUB_SHA" --generate-notes
          fi
