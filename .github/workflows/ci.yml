name: CI

on:
  # Branch pushes build in the repo that owns the branch, so a fork gets results without
  # waiting for upstream. Pull requests from forks build in the receiving repo.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Same-repo pull requests are already covered by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test

  build:
    # Same-repo pull requests are already covered by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Only 7zip-bin is needed for packaging; skipping scripts avoids the Electron download.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build package
        shell: powershell
        run: ./scripts/build-toolbox-gdi.ps1
      - name: Verify package
        shell: powershell
        run: ./scripts/verify-toolbox-gdi.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: tech-browser-scapp
          path: dist/*.scapp
          if-no-files-found: error
